<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <!-- 7-Segment Digital Font (DSEG7 Classic) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" />
  <!-- Clean Sans-Serif Font (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'DSEG7-Classic';
      src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Italic.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Italic.woff') format('woff'),
           url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Italic.ttf') format('truetype');
      font-weight: normal;
      font-style: italic;
    }

    @font-face {
      font-family: 'DSEG7-Classic';
      src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff') format('woff'),
           url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 20px 60px;
      user-select: none;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 760px;
    }

    /* Main Timer Block */
    .timer-block {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    /* Position 4: Cumulative Total Time (Top-Left above main counter, no outline) */
    .total-timer {
      font-family: 'DSEG7-Classic', 'DSEG7 Classic', monospace;
      font-size: clamp(1.1rem, 2.5vw, 1.55rem);
      font-weight: normal;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 2px;
      margin-bottom: 12px;
      padding-left: 4px;
      line-height: 1;
    }

    /* Position 3: Active Session Counter (Resets to 00:00:00 on Flag) */
    .main-timer {
      font-family: 'DSEG7-Classic', 'DSEG7 Classic', monospace;
      font-size: clamp(3.4rem, 10vw, 6.4rem);
      font-weight: normal;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 4px;
      line-height: 1.05;
      text-align: center;
    }

    /* Date, Dim Reset Button & Position 1 Sum Display below HH digits */
    .meta-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-top: 10px;
      padding-left: 4px;
    }

    .date-display {
      color: #e06c65;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .reset-btn {
      margin-top: 6px;
      background: transparent;
      border: none;
      color: #38383a;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 0;
      transition: color 0.15s ease;
    }

    .reset-btn:hover {
      color: #6e6e73;
    }

    /* Position 1: Updated Sum Display & Dim Hover-Only 'C' Clear Button */
    .sum-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      margin-bottom: -48px;
      margin-left: -68px;
      position: relative;
      z-index: 2;
    }

    .clear-sum-btn {
      background: transparent;
      border: none;
      color: #38383a;
      font-family: 'Inter', sans-serif;
      font-size: 1.15rem;
      font-weight: 500;
      cursor: pointer;
      opacity: 0;
      padding: 0 2px;
      line-height: 1;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .sum-row:hover .clear-sum-btn {
      opacity: 1;
    }

    .clear-sum-btn:hover {
      color: #6e6e73;
    }

    .sum-display {
      color: #e2f2a7;
      font-family: 'Inter', sans-serif;
      font-size: 2.75rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      line-height: 1;
    }

    /* Play/Pause & Flag Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 36px;
    }

    .control-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background-color: #1c1c1e;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.08s ease;
    }

    .control-btn:hover {
      background-color: #2c2c2e;
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Logged Sessions List */
    .sessions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      align-items: center;
    }

    .session-row {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 690px;
      justify-content: center;
    }

    /* Position 2: Semi-opaque '+' Button beside each logged row */
    .add-time-btn {
      background: transparent;
      border: none;
      color: #cccccc;
      opacity: 0.35;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      transition: opacity 0.15s ease, transform 0.08s ease;
    }

    .add-time-btn:hover {
      opacity: 0.75;
    }

    .add-time-btn:active {
      transform: scale(0.9);
    }

    .add-time-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
    }

    .session-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0d2614;
      border: 1px solid #163e21;
      border-radius: 8px;
      padding: 10px 18px;
      width: 420px;
      max-width: 100%;
    }

    .session-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    /* Clickable # Index Badge (Toggles Break / ON) */
    .session-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .session-hash {
      color: #9ba39e;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .session-num {
      background-color: #0d3868;
      color: #ffffff;
      font-family: 'DSEG7-Classic', 'DSEG7 Classic', monospace;
      font-size: 0.95rem;
      font-weight: normal;
      font-style: italic;
      padding: 3px 6px;
      border-radius: 3px;
      line-height: 1;
    }

    /* Editable Session Label */
    .session-label {
      background: transparent;
      border: none;
      outline: none;
      color: #e06c65;
      font-family: 'Inter', sans-serif;
      font-size: 1.25rem;
      font-weight: 400;
      width: 100%;
      min-width: 60px;
      user-select: text;
    }

    .session-label::placeholder {
      color: #e06c65;
      opacity: 0.7;
    }

    /* Logged Session Split Duration */
    .session-duration {
      font-family: 'DSEG7-Classic', 'DSEG7 Classic', monospace;
      font-size: 1.2rem;
      font-weight: normal;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 1.5px;
      flex-shrink: 0;
      margin-left: 12px;
    }

    /* External 12-Hour AM/PM Timestamp Range */
    .session-time-range {
      color: #e06c65;
      font-size: 1.3rem;
      font-weight: 400;
      white-space: nowrap;
      min-width: 175px;
    }

    @media (max-width: 620px) {
      .sum-row {
        margin-left: 0;
        margin-bottom: 12px;
      }
      .session-row {
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 8px;
      }
      .session-pill {
        width: calc(100% - 34px);
      }
      .session-time-range {
        padding-left: 34px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Timer Block -->
    <div class="timer-block">
      <!-- Position 4: Cumulative Total Time -->
      <div id="total-timer" class="total-timer">00:00:00</div>

      <!-- Position 3: Current Session Counter (Resets to 00:00:00 on Flag) -->
      <div id="main-timer" class="main-timer">00:00:00</div>

      <!-- Date, Dim Reset Button & Position 1 Sum Display -->
      <div class="meta-row">
        <div id="date-display" class="date-display">19-10-26 mon</div>
        <button id="reset-btn" class="reset-btn" type="button">reset</button>
        <!-- Position 1: Updated Sum Display with Hover-Only 'C' Button -->
        <div class="sum-row">
          <button id="clear-sum-btn" class="clear-sum-btn" type="button" title="Clear sum">C</button>
          <span id="sum-display" class="sum-display">0</span>
        </div>
      </div>
    </div>

    <!-- Play/Pause & Flag Controls -->
    <div class="controls">
      <button id="toggle-btn" class="control-btn" type="button" aria-label="Play or Pause">
        <svg id="play-icon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"></path>
        </svg>
        <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;">
          <path d="M6 5h3v14H6zm9 0h3v14h-3z"></path>
        </svg>
      </button>

      <button id="flag-btn" class="control-btn" type="button" aria-label="Flag Session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill: none;">
          <path d="M5 21V4l13 5-13 5"></path>
        </svg>
      </button>
    </div>

    <!-- Logged Sessions Container -->
    <div id="sessions-list" class="sessions-list"></div>
  </div>

  <script>
    const STORAGE_KEY = 'digital_stopwatch_state_v3';

    const totalTimerEl = document.getElementById('total-timer');
    const mainTimerEl = document.getElementById('main-timer');
    const dateDisplayEl = document.getElementById('date-display');
    const toggleBtn = document.getElementById('toggle-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const flagBtn = document.getElementById('flag-btn');
    const resetBtn = document.getElementById('reset-btn');
    const clearSumBtn = document.getElementById('clear-sum-btn');
    const sumDisplayEl = document.getElementById('sum-display');
    const sessionsListEl = document.getElementById('sessions-list');

    let state = {
      isRunning: false,
      accumulatedTotalMs: 0,
      lastStartTimestamp: null,
      lastFlagTotalMs: 0,
      currentSessionStartClock: null,
      summedSeconds: 0,
      sessions: []
    };

    // Format milliseconds to HH:MM:SS
    function formatDuration(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return [hours, minutes, seconds]
        .map(v => String(v).padStart(2, '0'))
        .join(':');
    }

    // Parse HH:MM:SS string into total seconds
    function parseDurationToSeconds(durationStr) {
      if (!durationStr) return 0;
      const parts = durationStr.split(':').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return 0;
      return parts[0] * 3600 + parts[1] * 60 + parts[2];
    }

    // Update Position 1 Sum Display (Default '0' when 0, otherwise HH:MM:SS)
    function updateSumDisplay() {
      if (!state.summedSeconds || state.summedSeconds <= 0) {
        sumDisplayEl.textContent = '0';
      } else {
        sumDisplayEl.textContent = formatDuration(state.summedSeconds * 1000);
      }
    }

    // Format current date as DD-MM-YY ddd (e.g., 19-10-26 mon)
    function updateDateDisplay() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yy = String(now.getFullYear()).slice(-2);
      const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
      const ddd = days[now.getDay()];
      dateDisplayEl.textContent = `${dd}-${mm}-${yy} ${ddd}`;
    }

    // Format a start and end Date into 12-hour AM/PM range
    function formatTimeRange12Hr(startDate, endDate) {
      const to12HrParts = (dateObj) => {
        const h24 = dateObj.getHours();
        const m = String(dateObj.getMinutes()).padStart(2, '0');
        const period = h24 >= 12 ? 'PM' : 'AM';
        const h12 = String(h24 % 12 || 12).padStart(2, '0');
        return { time: `${h12}:${m}`, period };
      };

      const start = to12HrParts(startDate);
      const end = to12HrParts(endDate);

      if (start.period === end.period) {
        return `${start.time} - ${end.time} ${end.period}`;
      }
      return `${start.time} ${start.period} - ${end.time} ${end.period}`;
    }

    // Calculate live total elapsed ms
    function getTotalElapsedMs() {
      if (state.isRunning && state.lastStartTimestamp !== null) {
        return state.accumulatedTotalMs + (Date.now() - state.lastStartTimestamp);
      }
      return state.accumulatedTotalMs;
    }

    // Render both Position 4 (Total) and Position 3 (Current Session) timers
    function updateTimerDisplays() {
      const totalMs = getTotalElapsedMs();
      const sessionMs = Math.max(0, totalMs - state.lastFlagTotalMs);

      totalTimerEl.textContent = formatDuration(totalMs);
      mainTimerEl.textContent = formatDuration(sessionMs);
    }

    function updateControlIcons() {
      if (state.isRunning) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Ignore storage errors
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = {
            isRunning: Boolean(parsed.isRunning),
            accumulatedTotalMs: Number(parsed.accumulatedTotalMs) || 0,
            lastStartTimestamp: parsed.lastStartTimestamp ? Number(parsed.lastStartTimestamp) : null,
            lastFlagTotalMs: Number(parsed.lastFlagTotalMs) || 0,
            currentSessionStartClock: parsed.currentSessionStartClock ? Number(parsed.currentSessionStartClock) : null,
            summedSeconds: Number(parsed.summedSeconds) || 0,
            sessions: Array.isArray(parsed.sessions) ? parsed.sessions : []
          };
        }
      } catch (e) {
        // Fallback to default state
      }
    }

    // Render logged session rows
    function renderSessions() {
      sessionsListEl.innerHTML = '';

      state.sessions.forEach((session, idx) => {
        const row = document.createElement('div');
        row.className = 'session-row';

        // Position 2: Semi-opaque '+' button beside each time log
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'add-time-btn';
        addBtn.title = 'Add this duration to sum';
        addBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none">
            <line x1="12" y1="4" x2="12" y2="20"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
          </svg>
        `;

        addBtn.addEventListener('click', () => {
          const secondsToAdd = parseDurationToSeconds(session.duration);
          state.summedSeconds = (state.summedSeconds || 0) + secondsToAdd;
          updateSumDisplay();
          saveState();
        });

        const pill = document.createElement('div');
        pill.className = 'session-pill';

        const left = document.createElement('div');
        left.className = 'session-left';

        // Clickable # badge that toggles between 'Break' and 'ON'
        const badge = document.createElement('div');
        badge.className = 'session-badge';
        badge.title = 'Click to toggle Break / ON';
        badge.innerHTML = `<span class="session-hash">#</span><span class="session-num">${session.index}</span>`;

        const labelInput = document.createElement('input');
        labelInput.type = 'text';
        labelInput.className = 'session-label';
        labelInput.value = session.label ?? 'Break';
        labelInput.placeholder = 'Break';

        // Toggle 'Break' <-> 'ON' on # badge click
        badge.addEventListener('click', () => {
          const nextLabel = labelInput.value.trim() === 'Break' ? 'ON' : 'Break';
          labelInput.value = nextLabel;
          state.sessions[idx].label = nextLabel;
          saveState();
        });

        // Manual typing support
        labelInput.addEventListener('input', (e) => {
          state.sessions[idx].label = e.target.value;
          saveState();
        });

        left.appendChild(badge);
        left.appendChild(labelInput);

        const durationEl = document.createElement('div');
        durationEl.className = 'session-duration';
        durationEl.textContent = session.duration;

        pill.appendChild(left);
        pill.appendChild(durationEl);

        const timeRangeEl = document.createElement('div');
        timeRangeEl.className = 'session-time-range';
        timeRangeEl.textContent = session.timeRange;

        row.appendChild(addBtn);
        row.appendChild(pill);
        row.appendChild(timeRangeEl);

        sessionsListEl.appendChild(row);
      });
    }

    // Clear Sum ('C') Button Handler
    clearSumBtn.addEventListener('click', () => {
      state.summedSeconds = 0;
      updateSumDisplay();
      saveState();
    });

    // Play / Pause Handler
    toggleBtn.addEventListener('click', () => {
      const now = Date.now();
      if (!state.isRunning) {
        if (!state.currentSessionStartClock) {
          state.currentSessionStartClock = now;
        }
        state.lastStartTimestamp = now;
        state.isRunning = true;
      } else {
        state.accumulatedTotalMs = getTotalElapsedMs();
        state.lastStartTimestamp = null;
        state.isRunning = false;
      }
      updateControlIcons();
      updateTimerDisplays();
      saveState();
    });

    // Flag Session Handler (Logs session, resets Position 3 to 00:00:00, keeps Position 4 counting)
    flagBtn.addEventListener('click', () => {
      const totalMs = getTotalElapsedMs();
      const sessionMs = totalMs - state.lastFlagTotalMs;

      if (sessionMs <= 0 && !state.isRunning) return;

      const now = Date.now();
      const startClock = state.currentSessionStartClock
        ? new Date(state.currentSessionStartClock)
        : new Date(now - sessionMs);
      const endClock = new Date(now);

      const newSession = {
        index: state.sessions.length + 1,
        label: 'Break',
        duration: formatDuration(sessionMs),
        timeRange: formatTimeRange12Hr(startClock, endClock)
      };

      state.sessions.push(newSession);

      // Reset current session baseline so Position 3 restarts from 00:00:00
      state.lastFlagTotalMs = totalMs;
      state.currentSessionStartClock = now;

      renderSessions();
      updateTimerDisplays();
      saveState();
    });

    // Dim Reset Button Handler
    resetBtn.addEventListener('click', () => {
      state = {
        isRunning: false,
        accumulatedTotalMs: 0,
        lastStartTimestamp: null,
        lastFlagTotalMs: 0,
        currentSessionStartClock: null,
        summedSeconds: 0,
        sessions: []
      };
      updateControlIcons();
      updateTimerDisplays();
      updateSumDisplay();
      renderSessions();
      saveState();
    });

    // Initialize App
    loadState();
    updateDateDisplay();
    updateControlIcons();
    updateTimerDisplays();
    updateSumDisplay();
    renderSessions();

    // High-frequency tick for accurate display updates
    setInterval(() => {
      if (state.isRunning) {
        updateTimerDisplays();
      }
      updateDateDisplay();
    }, 100);

    // Register Service Worker for Chrome PWA installation
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
